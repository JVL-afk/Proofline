[project]
name = "opportunity-intelligence-platform"
version = "0.0.0"
description = "Repository foundations for the opportunity intelligence platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=2.3,<2.4",
  "pytest>=9.1,<9.2",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false
required-version = ">=0.11.32,<0.12"

[tool.uv.workspace]
members = [
  "packages/m0-core",
  "packages/m0-local",
  "packages/research-core",
  "packages/research-local",
  "packages/opportunity-core",
  "packages/opportunity-local",
  "packages/audit-core",
  "packages/audit-local",
  "packages/demo-core",
  "packages/demo-local",
  "packages/outreach-core",
  "packages/outreach-local",
  "packages/communication-core",
  "packages/contact-core",
  "packages/contact-local",
  "packages/activation-core",
  "packages/activation-local",
  "packages/qualification-core",
  "packages/qualification-local",
  "packages/qualification-live",
  "packages/shadow-core",
  "packages/shadow-local",
  "services/api",
  "services/demo-runtime",
  "workers/core",
  "workers/research",
  "workers/browser",
  "workers/intelligence",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["local-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple adapters through a real SQLite database",
  "security: exercises hostile research inputs and trust boundaries",
]

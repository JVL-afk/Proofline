[project]
name = "opintel-intelligence-worker"
version = "0.1.0"
description = "Deterministic local M2-M5 intelligence worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-local",
  "opintel-opportunity-core",
  "opintel-opportunity-local",
  "opintel-research-local",
  "opintel-audit-core",
  "opintel-audit-local",
  "opintel-demo-core",
  "opintel-demo-local",
  "opintel-outreach-core",
  "opintel-outreach-local",
]

[project.scripts]
opintel-intelligence-worker = "opintel_intelligence_worker.main:run"

[tool.uv.sources]
opintel-m0-local = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-opportunity-local = { workspace = true }
opintel-research-local = { workspace = true }
opintel-audit-core = { workspace = true }
opintel-audit-local = { workspace = true }
opintel-demo-core = { workspace = true }
opintel-demo-local = { workspace = true }
opintel-outreach-core = { workspace = true }
opintel-outreach-local = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_intelligence_worker"]

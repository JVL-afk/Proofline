[project]
name = "opintel-research-worker"
version = "0.1.0"
description = "Separate bounded M1 HTTP research worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "opintel-research-core",
  "opintel-research-local",
]

[project.scripts]
opintel-research-worker = "opintel_research_worker.main:run"

[tool.uv.sources]
opintel-research-core = { workspace = true }
opintel-research-local = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_research_worker"]

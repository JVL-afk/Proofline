[project]
name = "opintel-demo-runtime"
version = "0.1.0"
description = "Separate-origin deterministic M4 simulation runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.139,<0.140",
  "opintel-demo-core",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
opintel-demo-runtime = "opintel_demo_runtime.main:run"

[tool.uv.sources]
opintel-demo-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_demo_runtime"]

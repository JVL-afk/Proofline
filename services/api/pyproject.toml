[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opintel-api"
version = "0.4.0"
description = "Authenticated M0-M3 evidence, opportunity, and deterministic audit API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.139,<0.140",
  "opintel-m0-core",
  "opintel-m0-local",
  "opintel-research-core",
  "opintel-research-local",
  "opintel-opportunity-core",
  "opintel-opportunity-local",
  "opintel-audit-core",
  "opintel-audit-local",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
opintel-api = "opintel_api.main:run"

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-m0-local = { workspace = true }
opintel-research-core = { workspace = true }
opintel-research-local = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-opportunity-local = { workspace = true }
opintel-audit-core = { workspace = true }
opintel-audit-local = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_api"]

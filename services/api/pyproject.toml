[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opintel-api"
version = "0.1.0"
description = "M0 authenticated application API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.139,<0.140",
  "opintel-m0-core",
  "opintel-m0-local",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
opintel-api = "opintel_api.main:run"

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-m0-local = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_api"]

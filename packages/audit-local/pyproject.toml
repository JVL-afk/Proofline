[project]
name = "opintel-audit-local"
version = "0.1.0"
description = "Development-only SQLite and canonical source adapters for M3"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-audit-core",
  "opintel-opportunity-core",
  "opintel-research-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-audit-core = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-research-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_audit_local"]

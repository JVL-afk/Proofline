[project]
name = "opintel-contact-core"
version = "0.1.0"
description = "M6 mock-first contact eligibility and controlled delivery domain"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
  "opintel-outreach-core",
  "pydantic>=2.12,<3",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-outreach-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_contact"]

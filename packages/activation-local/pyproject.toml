[project]
name = "opintel-activation-local"
version = "0.1.0"
description = "Append-only local persistence for M6.5 readiness governance"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-activation-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-activation-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_activation_local"]

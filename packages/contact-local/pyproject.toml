[project]
name = "opintel-contact-local"
version = "0.1.0"
description = "Deterministic local adapters for M6"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-contact-core",
  "opintel-outreach-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-contact-core = { workspace = true }
opintel-outreach-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_contact_local"]

[project]
name = "opintel-suppression-core"
version = "0.1.0"
description = "M6.9 deterministic suppression / opt-out registry domain"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_suppression"]

[project]
name = "opintel-audit-core"
version = "0.1.0"
description = "M3 evidence-linked audit domain, composition, QC, and review contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
  "opintel-opportunity-core",
  "pydantic>=2.12,<3",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-opportunity-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_audit"]

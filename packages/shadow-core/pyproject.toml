[project]
name = "opintel-shadow-core"
version = "0.1.0"
description = "M6.7A deterministic synthetic shadow-validation control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-audit-core",
  "opintel-demo-core",
  "opintel-m0-core",
  "opintel-opportunity-core",
  "opintel-outreach-core",
  "opintel-research-core",
  "pydantic>=2.13,<2.14",
]

[tool.uv.sources]
opintel-audit-core = { workspace = true }
opintel-demo-core = { workspace = true }
opintel-m0-core = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-outreach-core = { workspace = true }
opintel-research-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_shadow"]

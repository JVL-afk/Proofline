[project]
name = "opintel-demo-local"
version = "0.1.0"
description = "Development-only SQLite and canonical source adapters for M4"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-demo-core",
  "opintel-audit-local",
  "opintel-opportunity-core",
  "opintel-research-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-demo-core = { workspace = true }
opintel-audit-local = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-research-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_demo_local"]

[project]
name = "opintel-suppression-local"
version = "0.1.0"
description = "Development-only SQLite persistence for the M6.9 suppression registry"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-suppression-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-suppression-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_suppression_local"]

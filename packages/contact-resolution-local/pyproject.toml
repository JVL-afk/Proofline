[project]
name = "opintel-contact-resolution-local"
version = "0.1.0"
description = "Development-only SQLite persistence for M6.10 contact-endpoint evidence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-contact-resolution-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-contact-resolution-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_contact_resolution_local"]

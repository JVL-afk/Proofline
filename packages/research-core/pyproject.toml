[project]
name = "opintel-research-core"
version = "0.1.0"
description = "M1 research domain, application services, and ports"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
  "pydantic>=2.13,<2.14",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_research"]

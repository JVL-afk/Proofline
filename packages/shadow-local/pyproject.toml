[project]
name = "opintel-shadow-local"
version = "0.1.0"
description = "Local synthetic adapters for M6.7A-C shadow validation and gate preflight"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-shadow-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-shadow-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_shadow_local"]

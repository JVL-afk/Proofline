[project]
name = "opintel-research-local"
version = "0.1.0"
description = "Local M1 persistence and safe HTTP adapters"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
  "opintel-research-core",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-research-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_research_local"]

[project]
name = "opintel-qualification-local"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-qualification-core",
  "sqlalchemy>=2.0.48,<2.1",
]

[tool.uv.sources]
opintel-qualification-core = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_qualification_local"]

[project]
name = "opintel-outreach-core"
version = "0.1.0"
description = "M5 deterministic evidence-bound outreach package domain"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opintel-m0-core",
  "opintel-opportunity-core",
  "opintel-audit-core",
  "opintel-demo-core",
  "pydantic>=2.12,<3",
]

[tool.uv.sources]
opintel-m0-core = { workspace = true }
opintel-opportunity-core = { workspace = true }
opintel-audit-core = { workspace = true }
opintel-demo-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opintel_outreach"]
